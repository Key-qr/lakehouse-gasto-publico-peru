[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gasto-lakehouse"
version = "0.1.0"
description = "Lakehouse medallion (bronze/silver/gold) sobre la ejecución del gasto público del Perú (MEF)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Keysi Quiñe Rebaza" }]
keywords = ["data-engineering", "lakehouse", "delta-lake", "polars", "duckdb", "peru", "open-data"]
dependencies = [
    "polars>=1.30",
    "deltalake>=1.0",
    "pyarrow>=17",
    "numpy>=1.26",
    "duckdb>=1.1",
    "typer>=0.12",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50", "plotly>=5.24"]
orchestration = ["dagster>=1.8", "dagster-webserver>=1.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
lakehouse = "gasto_lakehouse.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gasto_lakehouse = ["py.typed", "sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Catálogos del clasificador presupuestal: una tupla por línea se lee mejor que partida.
"src/gasto_lakehouse/ingestion/sample.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: pruebas que generan volumen alto de datos"]
