# Fuentes oficiales: Plataforma Nacional de Datos Abiertos, dataset "Presupuesto y Ejecución de Gasto"
# publicado por el MEF (origen: Consulta Amigable).
# https://www.datosabiertos.gob.pe/dataset/presupuesto-y-ejecuci%C3%B3n-de-gasto
#
# Cada archivo es una foto completa del año: el MEF lo republica con el mes en curso, por eso
# la carga en silver reemplaza la partición del año (ver docs/adr/0003-carga-incremental.md).
# Los años cerrados pesan varios GB cada uno; empieza con uno o dos.

